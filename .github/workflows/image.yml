name: image

# Builds the worker images and pushes them to GHCR. linux/amd64 only: a RunPod
# worker is amd64, and building an arm64 variant nobody pulls would double the
# build for nothing.
#
# Two images, because an interactor image starts FROM one of them and adds
# itself. That is what keeps one copy of the job loop across however many
# interactors get an endpoint, and it is why both are published rather than only
# the one this repository runs on its own.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The C++ workers: rp-worker-echo and rp-worker-bus. Its build runs
          # proof/roundtrip.cpp, so no image comes out of a tree whose
          # correlation is broken.
          - dockerfile: Dockerfile
            suffix: ""
          # The Python worker, and the base an interactor written in Python
          # starts from. Nothing is compiled: iceoryx2 ships a manylinux wheel.
          - dockerfile: Containerfile.python
            suffix: "-python"
    steps:
      - uses: actions/checkout@v4

      # The default docker driver cannot export a GHA cache ("Cache export is
      # not supported for the docker driver"); buildx's container driver can.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
